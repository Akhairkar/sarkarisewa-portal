name: Data probe

# One-off data checks for new page groups (e.g. the PM-JAY hospital list).
# Run it on a data branch, never on main: it runs data-probe/run.sh from that
# branch and commits data-probe/out back to the same branch. Nothing here
# touches the site.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse main
        if: github.ref_name == 'main'
        run: |
          echo "Run this on a data branch, not main."
          exit 1
      - uses: actions/checkout@v4
      - name: Run probe
        continue-on-error: true
        run: bash data-probe/run.sh
      - name: Save results to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data-probe/out
          git commit -q -m "Data probe results" || exit 0
          git push
