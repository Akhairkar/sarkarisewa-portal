name: Deploy push worker

# Deploys cloudflare/push (the browser-notification sender with its
# 5-minute cron) and gives it the PUSH_SEND_KEY secret. The site worker is
# not touched. Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PUSH_SEND_KEY.
on:
  push:
    branches: [main]
    paths:
      - "cloudflare/push/**"
      - ".github/workflows/deploy-push-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-push-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloudflare/push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy worker
        run: npx --yes wrangler@4.154.0 deploy --config cloudflare/push/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set the send key
        run: printf '%s' "$PUSH_SEND_KEY" | npx --yes wrangler@4.154.0 secret put PUSH_SEND_KEY --config cloudflare/push/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUSH_SEND_KEY: ${{ secrets.PUSH_SEND_KEY }}
