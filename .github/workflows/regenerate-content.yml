name: Regenerate site content

# Runs entirely on GitHub's own computers — nothing to install on your
# laptop. Two ways it starts:
#   1. Automatically, once a day (catches new job alerts / blog posts /
#      services added from the admin dashboard without you doing anything)
#   2. Manually, any time, by clicking "Run workflow" on the Actions tab
#      on github.com (works from a phone browser too)
#
# What it does, in order:
#   1. Regenerate static pages for job alerts, blog posts, category pages,
#      services, states, state-wise services, and CSC directory centres
#      (tools/generate-*-pages.py)
#   2. Regenerate sitemap.xml
#   3. Submit the sitemap to IndexNow (Bing/Yandex)
#   4. If anything actually changed, commit and push it back to this
#      repo automatically — no local git commands needed.

on:
  workflow_dispatch: {}   # adds the manual "Run workflow" button
  schedule:
    - cron: "30 1 * * *"  # 07:00 IST every day (01:30 UTC)

# Lets the workflow push commits back to this repo.
permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate job alert pages
        run: python3 tools/generate-job-pages.py

      - name: Generate blog pages
        run: python3 tools/generate-blog-pages.py

      - name: Generate category pages
        run: python3 tools/generate-category-pages.py

      - name: Generate service pages
        run: python3 tools/generate-service-pages.py

      - name: Generate state-service pages
        run: python3 tools/generate-state-service-pages.py

      - name: Generate state pages
        run: python3 tools/generate-state-pages.py

      - name: Generate CSC directory pages
        run: python3 tools/generate-csc-pages.py

      - name: Regenerate sitemap.xml
        run: python3 generate-sitemap.py

      - name: Submit sitemap to IndexNow
        run: python3 tools/submit-indexnow.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "sarkarisewa-bot"
          git config user.email "actions@github.com"
          git add jobs/*.html blog/*.html category/*.html service/*.html states/*.html csc/*.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "Auto-regenerate static pages and sitemap [skip ci]"
            git push
          fi
