name: Partner Network Source Regression

on:
  push:
    branches:
      - feature/business-partner-network
    paths:
      - "partner-network/**"
      - "supabase/functions/partner-submit-enquiry/**"
      - ".github/workflows/partner-auth-source-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partner-network-source-tests
  cancel-in-progress: true

jobs:
  auth-source-tests:
    name: Auth and portal source checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/business-partner-network
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run source regression tests
        run: node --test partner-network/auth-source.test.mjs
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check public enquiry gateway
        run: deno check --no-lock supabase/functions/partner-submit-enquiry/index.ts
