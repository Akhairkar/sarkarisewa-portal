name: Automated Daily Updates Pipeline

on:
  schedule:
    # Runs 3 times a day: 04:00 UTC (9:30 AM IST), 12:00 UTC (5:30 PM IST), 18:00 UTC (11:30 PM IST)
    - cron: '0 4,12,18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 google-generativeai

      - name: Run Latest Updates Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python automation/update_pipeline.py

      - name: Generate RSS Feed & Broadcast to Telegram Channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          python automation/generate_rss_feed.py
          python automation/telegram_broadcaster.py

      - name: Run Integrity Audit
        run: |
          python fast_deep_audit.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "SarkariSewa Bot"
          git config --global user.email "bot@sarkarisewaindia.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new updates found to commit."
          else
            git commit -m "chore(auto-update): publish latest government updates, static pages and sitemap"
            git push origin main
          fi
