name: Official update watcher

# Every 2 hours from about 6 AM to 10 PM IST, checks the notice pages of UPSC,
# SSC (its JSON notice API), NTA, IBPS, AIIMS, RRB, CTET (via CBSE) and others (web/scripts/official-watch.mjs) and
# posts each new recruitment notification to the Telegram channel with its
# official link (results, answer keys and admit cards are skipped), plus each
# open job page newly added to our site (web/src/data/jobs.ts, jobs-daily/). What has been seen is kept in the
# Actions cache; if the cache is lost, the next run records the current
# notices silently instead of posting them again.
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL (optional).
on:
  schedule:
    - cron: "41 0-16/2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "send = post new items; dry_run = only print; probe = list what each site shows now"
        type: choice
        options: [send, dry_run, probe]
        default: send

permissions:
  contents: read

concurrency:
  group: official-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            web/scripts
            web/src/data
            web/src/guides/jobs
            jobs-daily
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore seen notices
        uses: actions/cache/restore@v4
        with:
          path: web/scripts/.watch-state.json
          key: official-watch-${{ github.run_id }}
          restore-keys: official-watch-
      # Some sites (IBPS, NIELIT) send their certificate without the
      # intermediate CA. Fetch it from the address the certificate itself
      # names (Authority Information Access) so TLS checks stay on.
      - name: Add missing intermediate certificates
        run: |
          : > /tmp/extra-ca.pem
          for h in www.ibps.in www.nielit.gov.in; do
            leaf=$(echo | timeout 20 openssl s_client -connect "$h:443" -servername "$h" 2>/dev/null | openssl x509 2>/dev/null) || continue
            uri=$(echo "$leaf" | openssl x509 -noout -ext authorityInfoAccess 2>/dev/null | grep -o 'CA Issuers - URI:[^ ]*' | head -1 | cut -d: -f2- || true)
            [ -n "$uri" ] || continue
            curl -fsSL --max-time 20 "$uri" -o /tmp/ca.bin || continue
            (openssl x509 -inform DER -in /tmp/ca.bin 2>/dev/null || openssl x509 -in /tmp/ca.bin) >> /tmp/extra-ca.pem && echo "added intermediate for $h"
          done
      - name: Check official sites and post
        working-directory: web/scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN: ${{ inputs.mode == 'dry_run' && '1' || '' }}
          PROBE: ${{ inputs.mode == 'probe' && '1' || '' }}
          NODE_EXTRA_CA_CERTS: /tmp/extra-ca.pem
        run: node official-watch.mjs
      - name: Save seen notices
        if: always() && hashFiles('web/scripts/.watch-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: web/scripts/.watch-state.json
          key: official-watch-${{ github.run_id }}
