name: SarkariSewa India Maintenance

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sarkarisewa-maintenance
  cancel-in-progress: false

jobs:
  repair-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install automation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r automation/requirements.txt

      - name: Retroactive CSC and Jan Aushadhi upgrade
        run: python scripts/upgrade_all_csc_and_janaushadhi_districts.py

      - name: Re-audit v3 repair pass
        run: python scripts/repair_v3.py

      - name: Run update content pipeline
        run: python automation/update_pipeline.py

      - name: Repair generated update links and metadata
        run: python scripts/repair_v3.py

      - name: Regenerate sitemap
        run: python generate-sitemap.py

      - name: Commit generated repairs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "sarkarisewa-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes."
          else
            git commit -m "chore: apply Re-Audit v3 SEO and content maintenance"
            git fetch origin main
            git rebase origin/main
            git push --force-with-lease origin HEAD:refs/heads/automation/re-audit-v3
            echo "Repairs pushed to automation/re-audit-v3; PR creation is handled outside Actions because this repository disallows GitHub Actions from creating pull requests."
          fi
