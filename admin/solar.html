<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="../assets/img/favicon-32.png" rel="icon" sizes="32x32" type="image/png"/>
<link href="../assets/img/favicon-16.png" rel="icon" sizes="16x16" type="image/png"/>
<link href="../assets/img/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180"/>
<link href="../favicon.ico" rel="icon"/>
<link href="../manifest.json" rel="manifest"/>
<title>Solar Leads — SarkariSewa Admin</title>
<meta content="noindex, nofollow" name="robots"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="../assets/css/style.css" rel="stylesheet"/>
<link href="../assets/css/admin-theme.css?v=3" rel="stylesheet"/>
<script defer src="../assets/js/admin-theme-toggle.js"></script>
<link rel="canonical" href="https://sarkarisewaindia.com/admin/solar.html"></head>
<body>
<div class="admin-layout" hidden="" id="dash-wrap">
<aside class="admin-sidebar">
<div class="admin-sidebar-brand">
<div class="admin-sidebar-logo">S</div>
<div>
<div class="admin-sidebar-title">SarkariSewa</div>
<div class="admin-sidebar-subtitle">Admin Console</div>
</div>
</div>
<nav class="admin-nav"></nav>
<div class="admin-sidebar-footer">
<button class="theme-toggle-btn" type="button">☀️ Light Mode</button>
<div id="whoami" style="font-size:0.78rem; color:var(--admin-text-muted);">Loading identity…</div>
<button class="logout-btn" id="logout" style="width:100%;">Log out</button>
</div>
</aside>
<main class="admin-main">
<div class="admin-topbar">
<div class="admin-page-title">
<h1>☀️ Solar Leads (PM Surya Ghar)</h1>
<p style="margin:4px 0 0; font-size:0.86rem; color:var(--admin-text-muted);">Quote requests from the /solar/ pages: who, where, which page and where the visitor came from.</p>
</div>
</div>
<div class="dash-card">
<div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
<h3 style="margin:0;" id="solar-count">Leads</h3>
<div style="display:flex; gap:8px; flex-wrap:wrap;">
<select id="solar-filter" class="theme-toggle-btn"><option value="">All status</option><option>new</option><option>contacted</option><option>sent</option><option>installed</option><option>junk</option></select>
<button class="theme-toggle-btn" id="solar-csv">⬇ CSV</button>
<button class="theme-toggle-btn" id="solar-refresh">↻ Refresh</button>
</div>
</div>
<div id="solar-summary" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:16px;"></div>
<div style="overflow-x:auto;">
<table class="admin-table" style="width:100%;">
<thead><tr><th>Date</th><th>Person</th><th>Address</th><th>Need</th><th>Source</th><th>Status</th></tr></thead>
<tbody id="solar-list"><tr><td colspan="6">Loading…</td></tr></tbody>
</table>
</div>
</div>
</main>
</div>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/admin-common.js"></script>
<script>adminGuard();</script>
<script src="../assets/js/admin-solar.js"></script>
</body>
</html>
