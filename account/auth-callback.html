<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Signing you in… | SarkariSewa India</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.card{width:min(420px,calc(100% - 32px));box-sizing:border-box;padding:28px;border:1px solid #e5e9f2;border-radius:20px;background:#fff;box-shadow:0 18px 50px rgba(18,32,58,.08);text-align:center}
.spinner{width:30px;height:30px;margin:0 auto 16px;border:3px solid #dfe5ef;border-top-color:#172033;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:20px;margin:0 0 8px}p{margin:0;color:#687386;line-height:1.55}.error{display:none;margin-top:16px;color:#a12626;font-size:14px}
</style>
  <link rel="canonical" href="https://sarkarisewaindia.com/account/auth-callback.html">
</head>
<body>
<main class="card">
<div class="spinner" aria-hidden="true"></div>
<h1>Signing you in…</h1>
<p>Please wait while we securely verify your email.</p>
<p lang="hi">कृपया प्रतीक्षा करें, आपका ईमेल सुरक्षित रूप से सत्यापित किया जा रहा है।</p>
<div id="error" class="error"></div>
</main>
<script src="../assets/js/supabase-client.js"></script>
<script>
(async function(){
"use strict";
const params=new URLSearchParams(location.search);
const requested=params.get("return")||"";
function safeReturn(v){
 try{
  const u=new URL(v,location.origin);
  if(u.origin!==location.origin||!u.pathname.startsWith("/")) return "";
  return u.pathname+u.search+u.hash;
 }catch(e){return ""}
}
const target=safeReturn(requested)||"/account/dashboard.html";
const errorBox=document.getElementById("error");
try{
 const c=await getSupabaseClient();
 if(!c) throw new Error("Supabase unavailable");
 const {data,error}=await c.auth.getSession();
 if(error) throw error;
 if(!data.session) throw new Error("Email verification could not create a session.");
 const user=data.session.user;
 const email=(user.email||"").trim().toLowerCase();
 const phone=(user.user_metadata&&user.user_metadata.phone_number)||null;
 if(email){
  const {error:profileError}=await c.from("customers").upsert({id:user.id,email,phone,updated_at:new Date().toISOString()},{onConflict:"id"});
  if(profileError) throw profileError;
 }
 location.replace(target);
}catch(err){
 console.error(err);
 errorBox.textContent="Verification failed. Please request a fresh sign-in link and try again.";
 errorBox.style.display="block";
 document.querySelector("h1").textContent="Sign-in link could not be completed";
 document.querySelector(".spinner").style.display="none";
}
})();
</script>
</body>
</html>
