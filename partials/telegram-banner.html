    </div>
    <div class="tg-text-wrap">
      <div class="tg-channel-name">SarkariSewa India 🇮🇳</div>
      <div class="tg-tagline">📢 रोज़ाना FREE सरकारी अपडेट्स पायें!</div>
    </div>
    <button class="tg-close-btn" onclick="closeTgBanner()" aria-label="Close">✕</button>
  </div>

  <a href="https://t.me/sarkarisewaindia" target="_blank" rel="noopener noreferrer" class="tg-join-btn" onclick="closeTgBanner()">
    <span class="tg-bell">🔔</span>
    Free Join करें — अभी! 
    <span class="tg-arrow">→</span>
  </a>

  <div class="tg-stats">
    <span class="tg-dot"></span>
    Naukri Alerts &nbsp;•&nbsp; Sarkari Yojana &nbsp;•&nbsp; Exam Updates &nbsp;•&nbsp; 100% Free
  </div>
</div>

<script>
(function() {
  var DISMISS_KEY = 'tg_banner_dismissed_v2';
  var banner = document.getElementById('tg-join-banner');
  if (!banner) return;

  // Don't show if already dismissed in last 3 days
  var dismissed = localStorage.getItem(DISMISS_KEY);
  if (dismissed && (Date.now() - parseInt(dismissed)) < 3 * 24 * 60 * 60 * 1000) return;

  // Show banner after 4 seconds
  setTimeout(function() {
    banner.classList.add('tg-visible');
  }, 4000);
})();

function closeTgBanner() {
  var banner = document.getElementById('tg-join-banner');
  if (banner) {
    banner.style.transform = 'translateX(-50%) translateY(120px)';
    banner.style.opacity = '0';
    setTimeout(function() { banner.style.display = 'none'; }, 400);
  }
  localStorage.setItem('tg_banner_dismissed_v2', Date.now().toString());
}
</script>
